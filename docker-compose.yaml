services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: nightrunner
      POSTGRES_PASSWORD: nightrunner_password
      POSTGRES_DB: nightrunner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightrunner -d nightrunner"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      FRONT_END_URL: "${FRONT_END_URL:-http://localhost:3000}"
      DATABASE_URL: postgresql://nightrunner:nightrunner_password@db:5432/nightrunner
      DEV_MODE: "${DEV_MODE:-false}"
      REQUIRE_IAM_PROXY_AUTH: "${REQUIRE_IAM_PROXY_AUTH:-false}"
      GCP_IAM_JWKS_URL: "${GCP_IAM_JWKS_URL:-https://www.googleapis.com/oauth2/3/certs}"
      GCP_IAM_AUDIENCE: "${GCP_IAM_AUDIENCE:-}"
      OIDC_ISSUER: "${OIDC_ISSUER:-http://localhost:4000}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-client-id}"
      JWKS_URL: "${JWKS_URL:-http://localhost:4000/.well-known/openid-configuration/jwks}"
      STORAGE_EMULATOR_HOST: "${STORAGE_EMULATOR_HOST:-http://fake-gcs:4443}"
      GCS_REPORTS_BUCKET: "${GCS_REPORTS_BUCKET:-nightrunner-reports-dev}"
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      oidc:
        condition: service_healthy
      fake-gcs:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  # VITE_ vars are baked into the JS bundle at build time
  frontend:
    build:
      context: ./nightrunner_frontend
      args:
        VITE_API_BACKEND_URL: "${VITE_API_BACKEND_URL:-http://localhost:8000/v1}"
        VITE_BACKEND_URL: "${VITE_BACKEND_URL:-http://localhost:8000}"
        VITE_OIDC_AUTHORITY: "${VITE_OIDC_AUTHORITY:-http://localhost:4000}"
        VITE_OIDC_CLIENT_ID: "${VITE_OIDC_CLIENT_ID:-client-id}"
    ports:
      - "3000:80"
    depends_on:
      app:
        condition: service_started
      oidc:
        condition: service_healthy

  oidc:
    image: ghcr.io/soluto/oidc-server-mock:0.8.0
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/.well-known/openid-configuration || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
    environment:
      ASPNETCORE_URLS: "http://+:4000"
      ISSUER: "http://localhost:4000"
      SERVER_OPTIONS_INLINE: |
        {
          "Authentication": {
            "CookieSameSiteMode": "Lax",
            "CheckSessionCookieSameSiteMode": "Lax"
          }
        }
      USERS_CONFIGURATION_INLINE: |
        [
          {
            "SubjectId": "admin-user-id",
            "Username": "adminuser",
            "Password": "password",
            "Claims": [
              { "Type": "name", "Value": "Admin User" },
              { "Type": "email", "Value": "admin@example.com" },
              { "Type": "isAdmin", "Value": "true", "ValueType": "boolean" }
            ]
          },
          {
            "SubjectId": "organizer-user-id",
            "Username": "organizeruser",
            "Password": "password",
            "Claims": [
              { "Type": "name", "Value": "Organizer User" },
              { "Type": "email", "Value": "organizer@example.com" },
              { "Type": "roles", "Value": "{\"01a022b8-45f0-7612-872e-201e8c8158db\": \"organizer\"}", "ValueType": "json" }
            ]
          },
          {
            "SubjectId": "scorer-user-id",
            "Username": "scoreruser",
            "Password": "password",
            "Claims": [
              { "Type": "name", "Value": "Scorer User" },
              { "Type": "email", "Value": "scorer@example.com" },
              { "Type": "roles", "Value": "{\"01a022b8-45f0-7612-872e-201e8c8158db\": \"scorer\"}", "ValueType": "json" }
            ]
          },
          {
            "SubjectId": "leader-user-id",
            "Username": "leaderuser",
            "Password": "password",
            "Claims": [
              { "Type": "name", "Value": "Station Leader User" },
              { "Type": "email", "Value": "leader@example.com" },
              { "Type": "roles", "Value": "{\"01a022b8-45f0-7612-872e-201e8c8158db\": \"station_leader\"}", "ValueType": "json" }
            ]
          },
          {
            "SubjectId": "member-user-id",
            "Username": "memberuser",
            "Password": "password",
            "Claims": [
              { "Type": "name", "Value": "Station Member User" },
              { "Type": "email", "Value": "member@example.com" },
              { "Type": "roles", "Value": "{\"01a022b8-45f0-7612-872e-201e8c8158db\": \"station_member\"}", "ValueType": "json" }
            ]
          }
        ]
      CLIENTS_CONFIGURATION_INLINE: |
        [
          {
            "ClientId": "client-id",
            "Description": "Night Runner React Frontend",
            "ClientSecrets": ["secret"],
            "AllowedGrantTypes": ["password", "client_credentials", "authorization_code"],
            "AllowedScopes": ["openid", "profile", "email"],
            "AlwaysSendClientClaims": true,
            "ClientClaimsPrefix": "",
            "RequireClientSecret": false,
            "Claims": [
              { "Type": "aud", "Value": "client-id" }
            ],
            "RedirectUris": [
                "http://localhost:3000/callback"
            ],
            "PostLogoutRedirectUris": [
                "http://localhost:3000/login"
            ],
          }
        ]

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    ports:
      - "4443:4443"
    command: ["-scheme", "http", "-public-host", "fake-gcs:4443", "-external-url", "http://localhost:4443"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4443"]
      interval: 3s
      timeout: 3s
      retries: 5
  seed:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_started
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Seeding database..."
        psql postgresql://nightrunner:nightrunner_password@db:5432/nightrunner <<'EOF'
        INSERT INTO events (id, name, date, description, rounding_precision)
        VALUES ('01a022b8-45f0-7612-872e-201e8c8158db', 'Mock Testing Event', '2026-09-15', 'Seeded for local OIDC testing.', 1000)
        ON CONFLICT (id) DO UPDATE SET 
          name = EXCLUDED.name, 
          date = EXCLUDED.date, 
          description = EXCLUDED.description, 
          rounding_precision = EXCLUDED.rounding_precision;

        INSERT INTO users (id, external_id, username, email, display_name, is_admin)
        VALUES ('u-admin-id', 'admin-user-id', 'adminuser', 'admin@example.com', 'Admin User', TRUE)
        ON CONFLICT (id) DO UPDATE SET 
          external_id = EXCLUDED.external_id, 
          username = EXCLUDED.username, 
          email = EXCLUDED.email, 
          display_name = EXCLUDED.display_name,
          is_admin = EXCLUDED.is_admin;

        INSERT INTO users (id, external_id, username, email, display_name)
        VALUES ('u-org-id', 'organizer-user-id', 'organizeruser', 'organizer@example.com', 'Organizer User')
        ON CONFLICT (id) DO UPDATE SET 
          external_id = EXCLUDED.external_id, 
          username = EXCLUDED.username, 
          email = EXCLUDED.email, 
          display_name = EXCLUDED.display_name;

        INSERT INTO users (id, external_id, username, email, display_name)
        VALUES ('u-scorer-id', 'scorer-user-id', 'scoreruser', 'scorer@example.com', 'Scorer User')
        ON CONFLICT (id) DO UPDATE SET 
          external_id = EXCLUDED.external_id, 
          username = EXCLUDED.username, 
          email = EXCLUDED.email, 
          display_name = EXCLUDED.display_name;

        INSERT INTO users (id, external_id, username, email, display_name)
        VALUES ('u-leader-id', 'leader-user-id', 'leaderuser', 'leader@example.com', 'Station Leader User')
        ON CONFLICT (id) DO UPDATE SET 
          external_id = EXCLUDED.external_id, 
          username = EXCLUDED.username, 
          email = EXCLUDED.email, 
          display_name = EXCLUDED.display_name;

        INSERT INTO users (id, external_id, username, email, display_name)
        VALUES ('u-member-id', 'member-user-id', 'memberuser', 'member@example.com', 'Station Member User')
        ON CONFLICT (id) DO UPDATE SET 
          external_id = EXCLUDED.external_id, 
          username = EXCLUDED.username, 
          email = EXCLUDED.email, 
          display_name = EXCLUDED.display_name;

        INSERT INTO user_roles (user_id, role)
        VALUES ('u-org-id', 'organizer')
        ON CONFLICT (user_id, role) DO NOTHING;

        INSERT INTO user_roles (user_id, role)
        VALUES ('u-scorer-id', 'scorer')
        ON CONFLICT (user_id, role) DO NOTHING;

        INSERT INTO user_roles (user_id, role)
        VALUES ('u-leader-id', 'station_leader')
        ON CONFLICT (user_id, role) DO NOTHING;

        INSERT INTO user_roles (user_id, role)
        VALUES ('u-member-id', 'station_member')
        ON CONFLICT (user_id, role) DO NOTHING;
        EOF
        echo "Database seeding completed!"

volumes:
  postgres_data:
