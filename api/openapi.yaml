openapi: 3.0.0
info:
  title: Night Runner API
  description: API for the Night Runner application to manage events, patrols, stations, and scoring.
  version: "1.0.0"
servers:
  - url: /
    description: Main API endpoint

security:
  - apiKey: []
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health Check
      description: Returns the status of the service.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
  /v1/auth/login:
    post:
      summary: Authenticate User
      description: Authenticates a user and returns a session token.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/me:
    get:
      summary: Get Current User
      description: Retrieves the profile and roles for the currently authenticated user.
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current user object with roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/users:
    get:
      summary: List Users
      description: Retrieves a list of all users.
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Register User
      description: Creates a new user.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/users/{userId}:
    get:
      summary: Get User
      description: Retrieves a specific user by their ID.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The user object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found.
    put:
      summary: Update User
      description: Updates a user's details or roles.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found.
    patch:
      summary: Patch User Role or Station
      description: Incrementally add/remove roles or update user status/station assignments.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatchRequest'
      responses:
        '200':
          description: User patched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found.
    delete:
      summary: Delete User
      description: Deletes a user from the system.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted successfully.
        '404':
          description: User not found.
  /v1/events:
    get:
      summary: List Events
      description: Retrieves a list of all events.
      tags:
        - Events
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      summary: Create Event
      description: Creates a new event.
      tags:
        - Events
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '201':
          description: Event created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'

  /v1/events/{eventId}:
    get:
      summary: Get Event
      description: Retrieves a specific event by its ID.
      tags:
        - Events
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The event object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found.
    put:
      summary: Update Event
      description: Updates an event's details, including registering/unregistering patrols and stations.
      tags:
        - Events
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Event updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found.
    delete:
      summary: Delete Event
      description: Deletes an event from the system.
      tags:
        - Events
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Event deleted successfully.
        '404':
          description: Event not found.

  /v1/patrols:
    get:
      summary: List Patrols
      description: Retrieves a list of all patrols.
      tags:
        - Patrols
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of patrols.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patrol'
    post:
      summary: Create Patrol
      description: Creates a new patrol.
      tags:
        - Patrols
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patrol'
      responses:
        '201':
          description: Patrol created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patrol'

  /v1/patrols/{patrolId}:
    get:
      summary: Get Patrol
      description: Retrieves a specific patrol by its ID.
      tags:
        - Patrols
      security:
        - bearerAuth: []
      parameters:
        - name: patrolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The patrol object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patrol'
        '404':
          description: Patrol not found.
    put:
      summary: Update Patrol
      description: Updates a patrol's details.
      tags:
        - Patrols
      security:
        - bearerAuth: []
      parameters:
        - name: patrolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patrol'
      responses:
        '200':
          description: Patrol updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patrol'
        '404':
          description: Patrol not found.
    delete:
      summary: Delete Patrol
      description: Deletes a patrol from the system.
      tags:
        - Patrols
      security:
        - bearerAuth: []
      parameters:
        - name: patrolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Patrol deleted successfully.
        '404':
          description: Patrol not found.

  /v1/stations:
    get:
      summary: List Stations
      description: Retrieves a list of all stations.
      tags:
        - Stations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of stations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Station'
    post:
      summary: Create Station
      description: Creates a new station.
      tags:
        - Stations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Station'
      responses:
        '201':
          description: Station created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'

  /v1/stations/{stationId}:
    get:
      summary: Get Station
      description: Retrieves a specific station by its ID.
      tags:
        - Stations
      security:
        - bearerAuth: []
      parameters:
        - name: stationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The station object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
        '404':
          description: Station not found.
    put:
      summary: Update Station
      description: Updates a station's details.
      tags:
        - Stations
      security:
        - bearerAuth: []
      parameters:
        - name: stationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Station'
      responses:
        '200':
          description: Station updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
        '404':
          description: Station not found.
    delete:
      summary: Delete Station
      description: Deletes a station from the system.
      tags:
        - Stations
      security:
        - bearerAuth: []
      parameters:
        - name: stationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Station deleted successfully.
        '404':
          description: Station not found.

  /v1/scores:
    post:
      summary: Submit Scores
      description: Submits a set of scores for a patrol's performance at a station.
      tags:
        - Scoring
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreSubmission'
      responses:
        '201':
          description: Scores submitted successfully.

  /v1/visits:
    get:
      summary: List Station Visits
      description: Retrieves all station check-in/check-out visits for an event.
      tags:
        - Visits
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of station visits for the event.
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId:
                    type: string
                  visits:
                    type: array
                    items:
                      $ref: '#/components/schemas/StationVisit'

  /v1/visits/check-in:
    post:
      summary: Check In Patrol
      description: Records a patrol's check-in at a station.
      tags:
        - Visits
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '200':
          description: Active visit updated with check-in timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationVisit'
        '201':
          description: Station visit created with check-in timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationVisit'

  /v1/visits/check-out:
    post:
      summary: Check Out Patrol
      description: Records a patrol's check-out from a station.
      tags:
        - Visits
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckOutRequest'
      responses:
        '200':
          description: Station visit updated with check-out timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationVisit'
        '201':
          description: Station visit created with check-out timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationVisit'
  /v1/reports/events/{eventId}:
    get:
      summary: Get Event Report
      description: Retrieves the final scoring report for a given event.
      tags:
        - Reports
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The event report object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReport'
        '404':
          description: Report not found for this event.


  /v1/reports/stations/{stationId}:
    get:
      summary: Get Station Report
      description: Retrieves the final scoring report for a given station.
      tags:
        - Reports
      security:
        - bearerAuth: []
      parameters:
        - name: stationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The station report object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationReport'
        '404':
          description: Report not found for this station.

  /v1/configuration-groups:
    get:
      summary: List Configuration Groups
      description: Retrieves all configuration groups.
      tags:
        - Configuration Groups
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of configuration groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigurationGroup'
    post:
      summary: Create Configuration Group
      description: Creates a new configuration group.
      tags:
        - Configuration Groups
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationGroup'
      responses:
        '201':
          description: Configuration group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationGroup'
  /v1/configuration-groups/{groupId}:
    get:
      summary: Get Configuration Group
      description: Retrieves a specific configuration group.
      tags:
        - Configuration Groups
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Configuration group object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationGroup'
        '404':
          description: Group not found.
    put:
      summary: Update Configuration Group
      description: Updates a configuration group.
      tags:
        - Configuration Groups
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationGroup'
      responses:
        '200':
          description: Configuration group updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationGroup'
        '404':
          description: Group not found.
    delete:
      summary: Delete Configuration Group
      description: Deletes a configuration group.
      tags:
        - Configuration Groups
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Group deleted successfully.
        '404':
          description: Group not found.
  /v1/configurations:
    get:
      summary: List Configurations
      description: Retrieves all configurations.
      tags:
        - Configurations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of configurations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Configuration'
    post:
      summary: Create Configuration
      description: Creates a new configuration.
      tags:
        - Configurations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Configuration'
      responses:
        '201':
          description: Configuration created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
  /v1/configurations/{configId}:
    get:
      summary: Get Configuration
      description: Retrieves a specific configuration.
      tags:
        - Configurations
      security:
        - bearerAuth: []
      parameters:
        - name: configId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Configuration object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '404':
          description: Configuration not found.
    put:
      summary: Update Configuration
      description: Updates a configuration.
      tags:
        - Configurations
      security:
        - bearerAuth: []
      parameters:
        - name: configId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Configuration'
      responses:
        '200':
          description: Configuration updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '404':
          description: Configuration not found.
    delete:
      summary: Delete Configuration
      description: Deletes a configuration.
      tags:
        - Configurations
      security:
        - bearerAuth: []
      parameters:
        - name: configId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Configuration deleted successfully.
        '404':
          description: Configuration not found.

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          example: "john.doe"
        password:
          type: string
          example: "a-strong-password"
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: "a-jwt-token"
        expiresIn:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "uuid-string-user-1"
          readOnly: true
        username:
          type: string
          example: "john.doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        displayName:
          type: string
          example: "John Doe"
        roles:
          type: object
          additionalProperties:
            type: string
          example: {"uuid-string-event-1": "organizer"}
        rolesList:
          type: array
          items:
            type: string
          example: ["event:uuid-string-event-1:organizer", "station:uuid-string-station-1:station_leader"]
        status:
          type: string
          enum: [pending, active, blocked]
          example: "active"
    UserPatchRequest:
      type: object
      properties:
        roleAction:
          type: string
          enum: [add, remove]
        eventId:
          type: string
          format: uuid
        role:
          type: string
        stationId:
          type: string
          format: uuid
        stationAction:
          type: string
          enum: [assign, remove]
        status:
          type: string
          enum: [pending, active, blocked]
    UserRegistration:
      type: object
      properties:
        username:
          type: string
          example: "jane.doe"
        email:
          type: string
          format: email
          example: "jane.doe@example.com"
        password:
          type: string
          format: password
          example: "another-strong-password"
          writeOnly: true
        displayName:
          type: string
          example: "Jane Doe"
    ConfigurationGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: "uuid-string-group-1"
        name:
          type: string
          example: "Ropework Group"
        description:
          type: string
          nullable: true
          example: "Configuration group for ropework stations"
    Configuration:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: "uuid-string-config-1"
        group_id:
          type: string
          format: uuid
          nullable: true
          example: "uuid-string-group-1"
        groupId:
          type: string
          format: uuid
          nullable: true
          example: "uuid-string-group-1"
        key:
          type: string
          example: "max_score"
        name:
          type: string
          example: "max_score"
        value:
          type: string
          example: "100"
        description:
          type: string
          nullable: true
          example: "Maximum score for this task"
        tasks:
          type: array
          items:
            type: object
            description: "Station task definition"
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "uuid-string-event-2026"
          readOnly: true
        name:
          type: string
          example: "Night Ops 2026"
        date:
          type: string
          format: date
          example: "2026-09-15"
        description:
          type: string
          example: "The 2026 annual Night Ops event."
        roundingPrecision:
          type: integer
          example: 1000
        organizers:
          type: array
          items:
            type: string
            format: uuid
          example: ["uuid-string-user-organizer-1"]
        stations:
          type: array
          items:
            type: string
            format: uuid
          example: ["uuid-string-station-1", "uuid-string-station-2"]
        patrols:
          type: array
          items:
            type: string
            format: uuid
          example: ["uuid-string-patrol-1"]
    Patrol:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "uuid-string-patrol-1"
          readOnly: true
        eventId:
          type: string
          format: uuid
          example: "uuid-string-event-1"
        name:
          type: string
          example: "TL Troop GA-0594"
        phoneNumber:
          type: string
          nullable: true
          example: "555-123-4567"
        radioFrequency:
          type: string
          nullable: true
          example: "462.5625 MHz"
        radioChannel:
          type: string
          nullable: true
          example: "Channel 1 / TAC-1"
        hasRadio:
          type: boolean
          default: false
          example: true
        radioIdentifier:
          type: string
          nullable: true
          example: "Radio-04"
        members:
          type: array
          items:
            $ref: '#/components/schemas/PatrolMember'
    PatrolMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "uuid-string-member-1"
          readOnly: true
        name:
          type: string
          example: "John Doe"
        rank:
          type: string
          example: "Navigator"
        troop:
          type: string
          example: "GA-0594"
    Station:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "uuid-string-station-1"
          readOnly: true
        eventId:
          type: string
          format: uuid
          example: "uuid-string-event-1"
        name:
          type: string
          example: "Ropes Challenge"
        description:
          type: string
          example: "A station focused on knot-tying and lashing skills."
        activeConfigurationId:
          type: string
          format: uuid
          example: "uuid-string-config-2"
        members:
          type: array
          items:
            $ref: '#/components/schemas/StationMember'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/StationTask'
    StationMember:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          example: "uuid-string-user-1"
        role:
          type: string
          enum:
            - station_leader
            - station_member
          example: "station_leader"
    StationConfiguration:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "uuid-string-config-2"
          readOnly: true
        name:
          type: string
          example: "2026 Night Ops - Advanced Knots"
        description:
          type: string
          example: "Advanced knot-tying scenario for the 2026 event."
        scenario:
          type: string
          example: "The patrol must construct a tripod lashing capable of supporting a 5-gallon water jug."
        notes:
          type: string
          example: "Materials provided: 3 staves, 1 rope (15ft)."
        scoringMethod:
          type: string
          example: "WeightedSum"
    StationTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "uuid-string-task-1"
          readOnly: true
        description:
          type: string
          example: "Tripod lashing is secure and stable."
        scoreValue:
          oneOf:
            - $ref: '#/components/schemas/ScoreValueRange'
            - $ref: '#/components/schemas/ScoreValueDelta'
            - $ref: '#/components/schemas/ScoreValueMulti'
            - $ref: '#/components/schemas/ScoreValueCompleted'
            - $ref: '#/components/schemas/ScoreValueStopwatch'
        scoreWeight:
          type: number
          example: 5.0
        isActive:
          type: boolean
          example: true
    ScoreValueRange:
      type: object
      properties:
        type:
          type: string
          enum: [RangeRated]
        min:
          type: integer
        max:
          type: integer
    ScoreValueDelta:
      type: object
      properties:
        type:
          type: string
          enum: [DeltaTime]
        scalar:
          type: integer
          default: 100
    ScoreValueMulti:
      type: object
      properties:
        type:
          type: string
          enum: [MultiChoice]
        options:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              value:
                type: integer
    ScoreValueCompleted:
      type: object
      properties:
        type:
          type: string
          enum: [Completed]
    ScoreValueStopwatch:
      type: object
      properties:
        type:
          type: string
          enum: [Stopwatch]
    ScoreSubmission:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        patrolId:
          type: string
          format: uuid
        stationId:
          type: string
          format: uuid
        configurationId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        entryMode:
          type: string
          enum: [live, manual]
          default: live
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        scores:
          type: array
          items:
            $ref: '#/components/schemas/Score'
    Score:
      type: object
      properties:
        taskId:
          type: string
          format: uuid
        value:
          oneOf:
            - type: integer
            - type: boolean
            - type: object
              properties:
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
    EventReport:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        eventName:
          type: string
        generatedAt:
          type: string
          format: date-time
        summary:
          type: object
          properties:
            totalPatrols:
              type: integer
            totalStations:
              type: integer
        patrolScores:
          type: array
          items:
            $ref: '#/components/schemas/PatrolScore'
    PatrolScore:
      type: object
      properties:
        patrolId:
          type: string
          format: uuid
        patrolName:
          type: string
        totalScore:
          type: number
        rank:
          type: integer
        stationBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/StationScore'
    StationScore:
      type: object
      properties:
        stationId:
          type: string
          format: uuid
        stationName:
          type: string
        score:
          type: number
    StationReport:
      type: object
      properties:
        stationId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        patrols:
          type: array
          items:
            $ref: '#/components/schemas/StationReportPatrol'
    StationReportPatrol:
