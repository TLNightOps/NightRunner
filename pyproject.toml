[project]
name = "nightrunner-backend"
version = "0.1.0"
dependencies = [
    "falcon[asgi]==4.3.1",
    "uvicorn==0.49.0",
    "aiosqlite==0.22.1",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.3",
    "pyjwt[crypto]==2.15.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "uuid6==2025.0.1",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "reportlab==5.0.1",
    "qrcode[pil]==8.2",
    "google-cloud-storage==3.14.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "schemathesis==4.34.2",
    "cryptography==50.0.2",
    "anyio==4.14.2",
]


[tool.setuptools]
packages = ["nightrunner_backend"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
